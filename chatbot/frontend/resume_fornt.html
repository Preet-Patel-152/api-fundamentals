<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume Analyzer</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
        }

        body {
            margin: 0;
            background: #04022b;
            color: #111827;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            padding: 24px;
        }

        h1 {
            margin-bottom: 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #6b7280;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #374151;
        }

        input[type="file"],
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            margin-bottom: 20px;
            font-size: 14px;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #6366f1;
        }

        button {
            background: #6366f1;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #4f46e5;
        }

        .result-title {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .result-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            min-height: 120px;
            white-space: pre-wrap;
            font-size: 14px;
        }

        .footer-note {
            margin-top: 10px;
            font-size: 12px;
            color: #6b7280;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>AI Resume Analyzer</h1>
        <p class="subtitle">
            Upload your resume and paste a job description to get an AI-powered match analysis.
        </p>

        <!-- Form -->
        <div class="card">
            <form id="analyze-form" enctype="multipart/form-data">
                <label for="resume">Resume (PDF)</label>
                <input type="file" id="resume" name="resume" accept=".pdf">

                <label for="job-text">Job Description</label>
                <textarea id="job-text" name="job_text" placeholder="Paste the job description here..."></textarea>

                <button type="submit">Analyze Resume</button>
            </form>
        </div>

        <!-- Results -->
        <div class="card">
            <div class="result-title">Analysis Result</div>
            <div id="result-box" class="result-box">
                No analysis yet.
            </div>
            <div class="footer-note">
                Results are advisory. Always tailor your resume for each role.
            </div>
        </div>
    </div>
</body>

</html>
