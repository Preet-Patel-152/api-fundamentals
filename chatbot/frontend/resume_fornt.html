<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Resume Analyzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <h1>AI Resume Analyzer</h1>
    <p>Upload your resume and paste a job description to get an AI-powered match score.</p>

    <!-- Upload Resume -->
    <form id="analyze-form" enctype="multipart/form-data">
        <label for="resume">Upload Resume (PDF):</label><br>
        <input type="file" id="resume" name="resume" accept=".pdf"><br><br>

        <!-- Job Description Input -->
        <label for="job-text">Job Description:</label><br>
        <textarea id="job-text" name="job-text" rows="10" cols="60"
            placeholder="Paste job description here..."></textarea><br><br>

        <!-- Submit Button -->
        <button type="submit">Analyze Resume</button>
    </form>

    <hr>

    <!-- Results Section -->
    <h2>Analysis Result</h2>
    <div id="result-box">
        <p>Results will appear here after analysis...</p>
    </div>

</body>

</html>
